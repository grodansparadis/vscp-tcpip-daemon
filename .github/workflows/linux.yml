name: Linux CI

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tag: ubuntu22.04
          - os: ubuntu-24.04
            tag: ubuntu24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libssl-dev libexpat1-dev zlib1g-dev \
            libcurl4-openssl-dev \
            libmosquitto-dev libsystemd-dev libsodium-dev \
            rpm

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVSCPD_ENABLE_SYSTEMD=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package (DEB + RPM + TGZ)
        working-directory: build
        run: cpack -G "DEB;RPM;TGZ"

      - name: Tag package names with distro and create SHA256 checksums
        working-directory: build
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          for f in *.deb *.rpm *.tar.gz; do
            case "$f" in
              *.tar.gz) new="${f%.tar.gz}-${TAG}.tar.gz" ;;
              *)        new="${f%.*}-${TAG}.${f##*.}" ;;
            esac
            mv -- "$f" "$new"
            sha256sum -- "$new" > "$new.sha256"
          done
          sha256sum -- *.deb *.rpm *.tar.gz > "SHA256SUMS-${TAG}.txt"
          cat "SHA256SUMS-${TAG}.txt"

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.tag }}
          path: |
            build/*.deb
            build/*.deb.sha256
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.tag }}
          path: |
            build/*.rpm
            build/*.rpm.sha256
          if-no-files-found: error

      - name: Upload TGZ
        uses: actions/upload-artifact@v7
        with:
          name: tgz-${{ matrix.tag }}
          path: |
            build/*.tar.gz
            build/*.tar.gz.sha256
          if-no-files-found: error

      - name: Upload SHA256 checksums
        uses: actions/upload-artifact@v7
        with:
          name: sha256-${{ matrix.tag }}
          path: build/SHA256SUMS-${{ matrix.tag }}.txt
          if-no-files-found: error

  release:
    name: Publish release packages
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
