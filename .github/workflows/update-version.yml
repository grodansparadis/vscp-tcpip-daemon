name: Update version

on:
  push:

permissions:
  contents: write

concurrency:
  group: update-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-version:
    if: github.ref_type == 'branch' && !github.event.deleted && !contains(github.event.head_commit.message || '', '[version-bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update version
        run: bash scripts/scripts/update-version.sh src/version.h

      - name: Commit version update
        run: |
          if git diff --quiet -- src/version.h docs/variables.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/version.h docs/variables.xml
          git commit -m "chore: update version [version-bot]"
          git push
